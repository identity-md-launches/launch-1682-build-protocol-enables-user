<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f6f5f2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        color: #1b1a17;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 600;
      }
      .brand svg {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 600;
        max-width: 980px;
      }
      p {
        margin: 24px 0 0;
        font-size: 34px;
        line-height: 1.35;
        color: #5d5a52;
        max-width: 980px;
      }
      .foot {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 26px;
        color: #5d5a52;
      }
      .pill {
        background: #e4ecf7;
        color: #24456f;
        padding: 6px 18px;
        border-radius: 999px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="#1f3a5f" />
          <circle cx="20" cy="20" r="5" fill="#f6f5f2" />
          <circle cx="34" cy="16" r="4" fill="#f6f5f2" opacity=".75" />
          <circle cx="44" cy="26" r="3.5" fill="#f6f5f2" opacity=".55" />
          <circle cx="26" cy="32" r="3" fill="#f6f5f2" opacity=".55" />
          <path d="M14 50 L50 50" stroke="#f6f5f2" stroke-width="5" stroke-linecap="round" />
          <path d="M38 40 L50 50 L38 60" fill="none" stroke="#f6f5f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        SwarmSweep
      </div>
      <div>
        <h1>Sweep swarm tokens into IMD</h1>
        <p>Sell every swarm-launched token in your wallet for $IMD in one transaction on Ethereum.</p>
      </div>
      <div class="foot"><span class="pill">Ethereum mainnet</span><span>2% fee to the treasury · you pay the gas</span></div>
    </div>
  </body>
</html>
